<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowball Wars — FrostZone</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>

  <!-- Background Canvas -->
  <canvas id="snow-canvas"></canvas>

  <!-- Navigation header override -->
  <header class="header-nav scrolled">
    <div class="container nav-container">
      <a href="/" class="logo">
        <span class="logo-icon">❄️</span><span>FrostZone</span>
      </a>
      <a href="/" class="btn btn--ghost" style="padding: 8px 16px; font-size: 14px;">
        &larr; Exit Lobby
      </a>
    </div>
  </header>

  <!-- Game Room Layout -->
  <div class="container room-layout">
    
    <!-- Lobby info bar -->
    <div class="room-bar anim-frost-in">
      <div class="room-bar__left">
        <h2 id="room-game-title" style="font-size: 1.5rem; display: flex; align-items: center; gap: 8px;">
          <span>❄️</span> Snowball Wars
        </h2>
        <div class="room-code">
          <span class="room-code__label">Room</span>
          <span class="room-code__value" id="room-code-text">ABCD</span>
          <button class="btn btn--icon" id="copy-room-btn" aria-label="Copy room link" style="width: 32px; height: 32px;">
            📋
          </button>
        </div>
      </div>
      
      <div class="room-bar__right">
        <div class="avatar-stack" id="room-avatars">
          <!-- Loaded dynamically -->
        </div>
        <button class="btn btn--primary" id="invite-btn" style="padding: 8px 16px; font-size: 14px;">
          👥 Invite
        </button>
      </div>
    </div>

    <!-- Main Section: Canvas & Sidebar -->
    <div class="room-main">
      
      <!-- Canvas Wrapper -->
      <div class="game-canvas-wrapper anim-frost-in" style="animation-delay: 100ms; padding: 0; background: #EBF3FA;" id="game-canvas-wrapper">
        <div id="game-container" style="width: 100%; height: 100%; position: relative;">
          <!-- Canvas added by script -->
        </div>
      </div>

      <!-- Chat & Actions Sidebar -->
      <div class="sidebar-pane anim-frost-in" style="animation-delay: 200ms;">
        <div class="pane-header">
          <span>Lobby Chat</span>
          <button class="btn" id="rename-btn" style="padding: 4px 8px; font-size: 12px; background: var(--ice-surface); color: var(--deep-ice);">
            Edit Nickname
          </button>
        </div>
        
        <!-- Scrollable Messages -->
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg chat-msg--system">
            <div class="chat-msg__body">Welcome to Snowball Wars! Move with WASD / Arrow keys. Space or Click to throw snowballs! ❄️</div>
          </div>
        </div>
        
        <!-- Reaction Tray -->
        <div class="reactions-panel">
          <button class="reaction-btn" data-emoji="❄️">❄️</button>
          <button class="reaction-btn" data-emoji="🔥">🔥</button>
          <button class="reaction-btn" data-emoji="🎯">🎯</button>
          <button class="reaction-btn" data-emoji="👑">👑</button>
          <button class="reaction-btn" data-emoji="😂">😂</button>
        </div>

        <!-- Chat Input Form -->
        <div class="chat-input-area">
          <form class="chat-input-form" id="chat-form">
            <input class="chat-input" id="chat-input" type="text" placeholder="Type a message..." maxlength="100" autocomplete="off">
            <button class="btn btn--primary" type="submit" style="padding: 8px 16px; font-size: 13px;">Send</button>
          </form>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Nickname Rename Modal -->
  <div class="modal-overlay" id="rename-modal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Change Nickname</h3>
        <button class="modal-close" id="rename-close">&times;</button>
      </div>
      <form id="rename-form">
        <div class="form-group">
          <label class="form-label" for="rename-input">New Username</label>
          <input class="form-input" id="rename-input" type="text" maxlength="15" required>
        </div>
        <button class="btn btn--primary" type="submit" style="width: 100%;">Save &rarr;</button>
      </form>
    </div>
  </div>

  <!-- Lobby scripts -->
  <script src="/assets/js/snow.js"></script>
  
  <script type="module">
    import { room } from '/assets/js/room.js';
    import SnowballWars from './game.js';

    // Update Room UI
    document.getElementById('room-code-text').textContent = room.roomId;
    
    // Copy/invite action
    const copyBtn = document.getElementById('copy-room-btn');
    const inviteBtn = document.getElementById('invite-btn');
    const copyAction = () => {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        const origText = copyBtn.textContent;
        copyBtn.textContent = '✅';
        setTimeout(() => copyBtn.textContent = origText, 1500);
      });
    };
    copyBtn.addEventListener('click', copyAction);
    inviteBtn.addEventListener('click', copyAction);

    // Edit nickname modal
    const renameModal = document.getElementById('rename-modal');
    const renameBtn = document.getElementById('rename-btn');
    const renameClose = document.getElementById('rename-close');
    const renameForm = document.getElementById('rename-form');
    const renameInput = document.getElementById('rename-input');

    renameBtn.addEventListener('click', () => {
      renameInput.value = room.playerName;
      renameModal.classList.add('active');
      renameInput.focus();
    });
    renameClose.addEventListener('click', () => renameModal.classList.remove('active'));
    renameForm.addEventListener('submit', (e) => {
      e.preventDefault();
      room.updatePlayerName(renameInput.value);
      renameModal.classList.remove('active');
    });

    // Avatars rendering
    const avatarsContainer = document.getElementById('room-avatars');
    const renderAvatars = (players) => {
      avatarsContainer.innerHTML = players.map(p => {
        const colorHash = Math.abs(p.name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0)) % 360;
        return `
          <div class="avatar" style="background: hsl(${colorHash}, 70%, 65%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff;" title="${p.name}">
            ${p.name.charAt(0).toUpperCase()}
          </div>
        `;
      }).join('');
    };
    renderAvatars(room.getPlayers());

    // Chat
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    const appendChatMessage = (msg, type = 'user') => {
      const msgDiv = document.createElement('div');
      if (type === 'system') {
        msgDiv.className = 'chat-msg chat-msg--system';
        msgDiv.innerHTML = `<div class="chat-msg__body">${msg}</div>`;
      } else {
        const isSelf = msg.isSelf;
        msgDiv.className = `chat-msg ${isSelf ? 'chat-msg--self' : ''}`;
        msgDiv.innerHTML = `
          <div class="chat-msg__meta"><span>${msg.senderName}</span></div>
          <div class="chat-msg__body">${msg.text}</div>
        `;
      }
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (text === '') return;
      room.sendChat(text);
      chatInput.value = '';
    });

    room.on('chat', appendChatMessage);
    room.on('system-chat', text => appendChatMessage(text, 'system'));
    room.on('players-update', renderAvatars);

    // Emojis Reactions
    const canvasWrapper = document.getElementById('game-canvas-wrapper');
    const triggerEmojiFly = (emoji) => {
      const el = document.createElement('div');
      el.className = 'emoji-fly';
      el.textContent = emoji;
      const startX = 50 + Math.random() * (canvasWrapper.clientWidth - 100);
      const startY = canvasWrapper.clientHeight - 40;
      el.style.left = `${startX}px`;
      el.style.top = `${startY}px`;
      el.style.setProperty('--x', `${(Math.random() - 0.5) * 200}px`);
      el.style.setProperty('--y', `${-(150 + Math.random() * 200)}px`);
      canvasWrapper.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    };

    document.querySelectorAll('.reaction-btn').forEach(btn => {
      btn.addEventListener('click', () => room.sendReaction(btn.dataset.emoji));
    });
    room.on('reaction', data => triggerEmojiFly(data.emoji));

    // Initialize Game engine
    const container = document.getElementById('game-container');
    const game = new SnowballWars(container, room.roomId, room.playerId);
    game.start();

    window.addEventListener('resize', () => {
      game.resize(container.clientWidth, container.clientHeight);
    });

    // Handle incoming game events from the room bus
    room.on('action', ({ playerId, data }) => {
      game.onAction(playerId, data);
    });

    room.on('join', ({ playerId, name, isBot }) => {
      game.addRemotePlayer(playerId, name, isBot);
    });

    room.on('leave', ({ playerId }) => {
      game.onPlayerLeave(playerId);
    });
  </script>
</body>
</html>
